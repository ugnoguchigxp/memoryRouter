services:
  context-still-db:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    container_name: context-still-db
    restart: unless-stopped
    ports:
      - '127.0.0.1:7889:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: context_still
    volumes:
      - context_still_pgdata:/var/lib/postgresql/data
    command:
      - 'postgres'
      - '-c'
      - 'shared_buffers=256MB'
      - '-c'
      - 'work_mem=16MB'
      - '-c'
      - 'maintenance_work_mem=128MB'
      - '-c'
      - 'max_connections=80'

volumes:
  context_still_pgdata:
