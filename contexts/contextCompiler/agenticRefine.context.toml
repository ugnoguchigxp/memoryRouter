[[sections]]
id = "selection.final-instruction"
kind = "instruction"
severity = "must"
enforcement = "prompt"
optimizable = false
text = '''
selectedIds は入力候補の id を relevance 順に列挙してください。
ゴールに無関係な知識しかない場合は、必ず空配列 `[]` を返してください。
'''

[sections.translations."en-US"]
text = '''
List candidate IDs in selectedIds by relevance.
If every candidate is unrelated to the goal, return an empty array `[]`.
'''
